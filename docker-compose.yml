services:
  tomb-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomb-processor
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_SHARE=false
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
